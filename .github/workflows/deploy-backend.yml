name: CD — Deploy Backend APNs Worker

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply D1 Schema/Migrations"
        required: false
        default: false
        type: boolean
      sync_secrets:
        description: "Sync APNs & Admin secrets from GitHub Secrets"
        required: false
        default: true
        type: boolean

concurrency:
  group: cd-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Quality Gate: Typecheck & Validation ──────────────────
  validate:
    name: Validate & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      - name: Typecheck TypeScript
        run: cd backend && npm run typecheck

  # ── Deployment (Main branch or Manual Trigger) ────────────
  deploy:
    name: Deploy to Cloudflare
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: cd backend && npm ci

      # ── Sync Secrets to Cloudflare Worker ─────────────────
      - name: Sync Cloudflare Secrets
        if: github.event_name == 'push' || (inputs.sync_secrets != false && inputs.sync_secrets != 'false')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          ADMIN_API_KEY: ${{ secrets.LOVELYMUSIC_ADMIN_API_KEY || secrets.ADMIN_API_KEY }}
        run: |
          cd backend
          if [ -n "$APNS_PRIVATE_KEY" ]; then
            echo "$APNS_PRIVATE_KEY" | npx wrangler secret put APNS_PRIVATE_KEY
            echo "✅ Synced APNS_PRIVATE_KEY secret"
          else
            echo "::warning::APNS_PRIVATE_KEY secret not found in GitHub Secrets"
          fi

          if [ -n "$ADMIN_API_KEY" ]; then
            echo "$ADMIN_API_KEY" | npx wrangler secret put ADMIN_API_KEY
            echo "✅ Synced ADMIN_API_KEY secret"
          else
            echo "::warning::ADMIN_API_KEY secret not found in GitHub Secrets"
          fi

      # ── Optional: Apply D1 Migrations ─────────────────────
      - name: Apply D1 Database Migrations
        if: inputs.apply_migrations == true || inputs.apply_migrations == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd backend
          npx wrangler d1 execute lovelymusic-apns-db --remote --file=schema.sql
          echo "✅ Applied schema.sql migrations to remote D1 database"

      # ── Deploy Worker ─────────────────────────────────────
      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'backend'

      # ── Post-Deploy Health Check ──────────────────────────
      - name: Verify Worker Health & CORS
        env:
          WORKER_URL: ${{ secrets.LOVELYMUSIC_WORKER_URL }}
        run: |
          if [ -n "$WORKER_URL" ]; then
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "${WORKER_URL}/api/v1/devices/register")
            if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 204 ]; then
              echo "✅ Worker health check passed with status $RESPONSE"
            else
              echo "::warning::Worker returned unexpected health check status: $RESPONSE"
            fi
          else
            echo "ℹ️ Skipping health check: LOVELYMUSIC_WORKER_URL secret not configured"
          fi
