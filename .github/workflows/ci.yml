name: CI — Test & Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/instructions/**"
      - "LICENSE"
      - "backend/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/instructions/**"
      - "LICENSE"
      - "backend/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.2"
  SIMULATOR_NAME: "iPhone 16"
  SCHEME_APP: "LovelyMusic"
  SCHEME_TESTS: "LovelyMusicTests"
  PROJECT: "LovelyMusic.xcodeproj"

jobs:
  test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Decode Secrets.plist
        env:
          SECRETS_PLIST_BASE64: ${{ secrets.SECRETS_PLIST_BASE64 }}
        run: |
          if [ -n "$SECRETS_PLIST_BASE64" ]; then
            echo "$SECRETS_PLIST_BASE64" | base64 --decode > LovelyMusic/Resources/Secrets.plist
          else
            echo "Warning: SECRETS_PLIST_BASE64 not set, using empty Secrets.plist"
            cp Secrets.plist.example LovelyMusic/Resources/Secrets.plist
          fi

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Package.resolved', 'fastlane/swift/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME_APP }}"

      - name: Build (Debug)
        run: |
          xcodebuild build \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME_APP }}" \
            -destination "platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }}" \
            -configuration Debug \
            -quiet \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME_TESTS }}" \
            -destination "platform=iOS Simulator,name=${{ env.SIMULATOR_NAME }}" \
            -resultBundlePath TestResults.xcresult \
            -quiet \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
